<VirtualHost *:8443>
    ServerName seooutsourcingphilippines.com
    DocumentRoot /var/www/sop-hostinger/public_html
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/sop-qa.pem
    SSLCertificateKeyFile /etc/ssl/private/sop-qa.key
    <Directory /var/www/sop-hostinger/public_html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
