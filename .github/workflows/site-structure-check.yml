name: Website source QA

on:
  push:
    branches: [main]
    paths:
      - "standalone/**"
      - "wordpress/**"
      - "scripts/**"
      - ".github/workflows/site-structure-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate 60-page website and internal links
        run: python3 scripts/check_site.py
      - name: Validate WordPress PHP syntax
        run: |
          for file in wordpress/sop-premium-agency/*.php wordpress/sop-proposal-form/*.php; do
            php -l "$file" || exit 1
          done
