name: Website source QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website files, titles, H1s, canonicals, and draft import
        run: python3 scripts/check_site.py
      - name: Check PHP syntax
        shell: bash
        run: |
          for file in wordpress/sop-premium-agency/*.php wordpress/sop-proposal-form/*.php; do
            php -l "$file" || exit 1
          done
