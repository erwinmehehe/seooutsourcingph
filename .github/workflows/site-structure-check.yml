name: Site structure checks

on:
  pull_request:
    paths:
      - "standalone/**"
      - "wordpress/**"
  push:
    branches: [main, "staging/**"]
    paths:
      - "standalone/**"
      - "wordpress/**"

jobs:
  website-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check project structure and HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from html.parser import HTMLParser
          import sys

          root = Path("standalone/site")
          if not root.is_dir():
              print("Full website source has not been imported yet. Import the release package into standalone/ and wordpress/.")
              sys.exit(1)

          pages = list(root.rglob("index.html"))
          if len(pages) < 60:
              print(f"Expected 60 or more index.html pages, found {len(pages)}")
              sys.exit(1)

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = 0
                  self.h1 = 0
                  self.canonical = []
                  self.local_links = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "title": self.title += 1
                  if tag == "h1": self.h1 += 1
                  if tag == "link" and a.get("rel") == "canonical": self.canonical.append(a.get("href", ""))
                  if tag == "a":
                      href = a.get("href", "")
                      if href.startswith("/") and not href.startswith("//") and not href.startswith("/#"):
                          self.local_links.append(href.split("#",1)[0].split("?",1)[0])

          errors = []
          for file in pages:
              p = Page()
              p.feed(file.read_text(encoding="utf-8"))
              if p.title != 1 or p.h1 != 1 or len(p.canonical) != 1:
                  errors.append(f"{file}: title={p.title} h1={p.h1} canonical={len(p.canonical)}")
              for url in p.local_links:
                  if not url: continue
                  path = root / url.lstrip("/")
                  if not (path.is_file() or (path / "index.html").is_file()):
                      errors.append(f"{file}: missing internal link target {url}")
          print(f"Checked {len(pages)} pages; errors: {len(errors)}")
          for e in errors[:50]: print(e)
          if errors: sys.exit(1)
          PY
