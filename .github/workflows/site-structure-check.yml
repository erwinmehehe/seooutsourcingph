name: Website source QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: website-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check website files, titles, H1s, canonicals, and draft import
        run: python3 scripts/check_site.py
      - name: Verify Australian programmatic SEO generator output and anti-thin-content gates
        run: node scripts/generate_au_pseo.cjs --check
      - name: Check curated Australian page originality and evidence gates
        run: python3 scripts/au_pseo_quality.py
      - name: Check editorial originality and conversion source safeguards
        run: python3 scripts/content_gate.py
      - name: Verify production is blocked until signed off
        run: python3 scripts/build_release.py --audit
      - name: Check JavaScript syntax
        run: |
          node --check standalone/site/assets/site.js
          node --check wordpress/sop-premium-agency/assets/site.js
      - name: Compile Python services and release scripts
        run: |
          python3 -m py_compile standalone/backend/server.py scripts/build_release.py scripts/content_gate.py
      - name: Check PHP syntax
        shell: bash
        run: |
          for file in wordpress/sop-premium-agency/*.php wordpress/sop-proposal-form/*.php; do
            php -l "$file" || exit 1
          done
