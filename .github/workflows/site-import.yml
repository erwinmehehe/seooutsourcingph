name: Expand website source onto main

on:
  push:
    branches: [main]
    paths:
      - ".import/website-source.zip"
      - ".github/workflows/site-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Safely expand and verify website source
        run: |
          if [ ! -f .import/website-source.zip ]; then
            echo "No import archive found. Nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('.').resolve()
          with ZipFile('.import/website-source.zip') as z:
              for member in z.infolist():
                  relative=Path(member.filename)
                  if member.is_dir():
                      continue
                  if relative.is_absolute() or '..' in relative.parts or relative.parts[0]=='.git':
                      raise SystemExit('Invalid ZIP member: '+member.filename)
                  dest=(root/relative).resolve()
                  if root not in dest.parents and dest != root:
                      raise SystemExit('Invalid destination: '+member.filename)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(member))
          PY
          python3 scripts/check_site.py
          rm .import/website-source.zip
      - name: Commit website source directly to main
        run: |
          if [ -f .import/website-source.zip ]; then
            echo "Import archive still present. Aborting."
            exit 1
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: import complete 60-page SEO outsourcing website into main"
          git push origin HEAD:main
