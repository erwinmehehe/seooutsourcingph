name: Launch readiness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_wordpress.py --check
      - run: python3 scripts/version_assets.py --check
      - run: python3 scripts/preserve_migration.py --check
      - run: node --check standalone/site/assets/site.js
      - run: node --check standalone/site/assets/measurement.js
      - run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/docker_fixture.py "$RUNNER_TEMP/sop-docker"
      - run: docker build -t sop-qa "$RUNNER_TEMP/sop-docker"
      - name: Check container serving and restart
        run: |
          docker run -d --name sop-qa -e SEO_PRODUCTION=0 -p 127.0.0.1:8098:8080 sop-qa
          for i in {1..15}; do curl -fsS http://127.0.0.1:8098/ && break || sleep 1; done
          curl -fsS http://127.0.0.1:8098/ | grep 'Container QA'
          docker restart sop-qa
          for i in {1..15}; do curl -fsS http://127.0.0.1:8098/ && break || sleep 1; done
          curl -fsS http://127.0.0.1:8098/ | grep 'Container QA'
      - if: always()
        run: docker rm -f sop-qa || true
  wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-qa-only
          MYSQL_DATABASE: wordpress_qa
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -plocal-qa-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated WordPress and test theme and form
        env:
          WP_CLI_ALLOW_ROOT: '1'
        run: |
          curl -fsSLo "$RUNNER_TEMP/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP="$RUNNER_TEMP/wp-qa"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" config create --path="$WP" --dbname=wordpress_qa --dbuser=root --dbpass=local-qa-only --dbhost=127.0.0.1:3306
          php "$RUNNER_TEMP/wp-cli.phar" config set SOP_LEADS_EMAIL qa@example.com --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" config set DISABLE_WP_CRON true --raw --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" config set WP_HTTP_BLOCK_EXTERNAL true --raw --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" core install --path="$WP" --url=https://seooutsourcingphilippines.com --title='Local QA' --admin_user=qa --admin_password=local-qa-only-password --admin_email=qa@example.com --skip-email
          cp -R wordpress/sop-premium-agency "$WP/wp-content/themes/"
          cp -R wordpress/sop-proposal-form "$WP/wp-content/plugins/"
          php "$RUNNER_TEMP/wp-cli.phar" plugin activate sop-proposal-form --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" theme activate sop-premium-agency --path="$WP"
          php "$RUNNER_TEMP/wp-cli.phar" eval-file "$GITHUB_WORKSPACE/tests/wordpress-smoke.php" --path="$WP" --url=https://seooutsourcingphilippines.com
